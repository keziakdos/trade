services:
  web:
    build: .
    container_name: rwatrade_app
    restart: always
    ports:
      - "127.0.0.1:5005:5000"  # Écoute locale uniquement (sécurité Nginx)
    volumes:
      - ./instance:/app/instance # Persistance de la DB SQLite
      - ./app:/app/app           # Hot-reload si on modifie le code (optionnel)
    environment:
      - FLASK_APP=run.py
      - FLASK_ENV=production
      - SECRET_KEY=votre_cle_secrete_tres_longue_et_aleatoire_ici
