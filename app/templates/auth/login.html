{% extends "base.html" %}

{% block content %}
<div class="flex items-center justify-center min-h-[80vh]">
    <div class="w-full max-w-md p-8 space-y-8 bg-rwa-card rounded-xl shadow-2xl border border-gray-800">
        
        <div class="text-center">
            <h2 class="text-3xl font-bold text-white tracking-tight">Connexion</h2>
            <p class="mt-2 text-sm text-gray-400">Accédez à votre espace RwaTrade</p>
        </div>

        <form class="mt-8 space-y-6" action="{{ url_for('auth.login') }}" method="POST">
            <div class="space-y-4">
                <div>
                    <label for="email" class="block text-sm font-medium text-gray-300">Email</label>
                    <input id="email" name="email" type="email" required 
                           class="mt-1 block w-full px-3 py-2 bg-gray-900 border border-gray-700 rounded-md text-white placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-rwa-blue focus:border-transparent transition sm:text-sm">
                </div>
                <div>
                    <label for="password" class="block text-sm font-medium text-gray-300">Mot de passe</label>
                    <input id="password" name="password" type="password" required 
                           class="mt-1 block w-full px-3 py-2 bg-gray-900 border border-gray-700 rounded-md text-white placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-rwa-blue focus:border-transparent transition sm:text-sm">
                </div>
            </div>

            <div>
                <button type="submit" 
                        class="w-full flex justify-center py-2 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-rwa-blue hover:bg-sky-600 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-offset-gray-900 focus:ring-rwa-blue transition duration-150">
                    Se connecter
                </button>
            </div>
        </form>

        <div class="text-center mt-4">
            <p class="text-sm text-gray-400">
                Pas encore de compte ? 
                <a href="{{ url_for('auth.register') }}" class="font-medium text-rwa-blue hover:text-sky-400">Créer un compte</a>
            </p>
        </div>
    </div>
</div>
{% endblock %}
